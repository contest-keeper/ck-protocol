name: Release

# Only develop may be promoted to main, so the release PR goes into develop and the tag is made there.
on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: contest-keeper/.github/.github/workflows/release-please.yml@main
    with:
      target-branch: develop
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Build and upload release files here, e.g.:
  # build:
  #   needs: release-please
  #   if: needs.release-please.outputs.release_created == 'true'
