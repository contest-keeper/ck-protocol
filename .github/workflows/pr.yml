name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    uses: contest-keeper/.github/.github/workflows/pr-title.yml@main
  common:
    uses: contest-keeper/.github/.github/workflows/common-ci.yml@main
  rust:
    uses: contest-keeper/.github/.github/workflows/rust-ci.yml@main
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
